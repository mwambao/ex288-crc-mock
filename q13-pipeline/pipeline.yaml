apiVersion: tekton.dev/v1
kind: Task
metadata: {name: echo-message}
spec:
 params: [{name: message,type: string}]
 steps:
 - name: echo
   image: registry.access.redhat.com/ubi9/ubi-minimal:latest
   script: |
     #!/bin/sh
     echo "$(params.message)"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata: {name: ex288-pipeline}
spec:
 params: [{name: message,type: string,default: pipeline-ok}]
 tasks:
 - name: say-it
   taskRef: {name: echo-message}
   params: [{name: message,value: "$(params.message)"}]
