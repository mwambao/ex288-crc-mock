apiVersion: tekton.dev/v1
kind: Pipeline
metadata: {name: deploy}
spec:
  params:
  - {name: APP_NAME, type: string}
  tasks:
  - name: verify-deploy-input
    taskSpec:
      params: [{name: APP_NAME, type: string}]
      steps:
      - name: verify
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        script: |
          #!/bin/sh
          echo "Deploying $(params.APP_NAME)"
    params: [{name: APP_NAME, value: "$(params.APP_NAME)"}]
