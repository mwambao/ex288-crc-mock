apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: deploy-template
parameters:
- name: APP_NAME
  required: true
- name: REPLICAS
  value: "1"
objects:
- apiVersion: apps/v1
  kind: Deployment
  metadata: {name: "${APP_NAME}"}
  spec:
    replicas: ${{REPLICAS}}
    selector: {matchLabels: {app: "${APP_NAME}"}}
    template:
      metadata: {labels: {app: "${APP_NAME}"}}
      spec:
        containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/${APP_NAME}:latest
          ports: [{containerPort: 8080}]
- apiVersion: v1
  kind: Service
  metadata: {name: "${APP_NAME}"}
  spec: {selector: {app: "${APP_NAME}"}, ports: [{port: 8080, targetPort: 8080}]}
