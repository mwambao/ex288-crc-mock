apiVersion: v1
kind: ConfigMap
metadata: {name: shared-config}
data: {MESSAGE: multi-container-ok}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: multi}
spec:
 replicas: 1
 selector: {matchLabels: {app: multi}}
 template:
  metadata: {labels: {app: multi}}
  spec:
   volumes: [{name: shared,emptyDir: {}}]
   containers:
   - name: writer
     image: registry.access.redhat.com/ubi9/ubi-minimal:latest
     command: ["/bin/sh","-c","while true; do echo $MESSAGE > /shared/message; sleep 5; done"]
     envFrom: [{configMapRef: {name: shared-config}}]
     volumeMounts: [{name: shared,mountPath: /shared}]
   - name: reader
     image: registry.access.redhat.com/ubi9/ubi-minimal:latest
     command: ["/bin/sh","-c","while true; do cat /shared/message 2>/dev/null || true; sleep 5; done"]
     volumeMounts: [{name: shared,mountPath: /shared}]
