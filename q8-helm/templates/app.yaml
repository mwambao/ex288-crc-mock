apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}}}
    spec:
      containers:
      - name: web
        image: registry.access.redhat.com/ubi9/python-311:latest
        command: ["/bin/bash","-c"]
        args: ['mkdir -p /tmp/site; printf "%s\n" "{{ .Values.message }}" > /tmp/site/index.html; cd /tmp/site; python3 -m http.server 8080']
        ports: [{containerPort: 8080}]
      - name: helper
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        command: ["/bin/sh","-c","while true; do sleep 300; done"]
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}}
spec: {selector: {app: {{ .Release.Name }}}, ports: [{port: 8080,targetPort: 8080}]}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: {{ .Release.Name }}}
spec: {to: {kind: Service,name: {{ .Release.Name }}}}
