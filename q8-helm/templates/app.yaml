apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}}}
    spec:
      containers:
      - name: web
        image: {{ .Values.image }}
        command: ["/bin/sh","-c"]
        args: ["while true; do { echo -e 'HTTP/1.1 200 OK\\r\\n'; echo '{{ .Values.message }}'; } | nc -l -p 8080; done"]
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}}
spec: {selector: {app: {{ .Release.Name }}}, ports: [{port: 8080,targetPort: 8080}]}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: {{ .Release.Name }}}
spec: {to: {kind: Service,name: {{ .Release.Name }}}}
